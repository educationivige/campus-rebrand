<!-- [NEO] Rebrand del aviso "habilitar popups" de SCORM (iframe loadSCO). Pegar en HTML adicional. -->

<script>
(function () {
  'use strict';

  var COLOR_MAP = {
    '#006975': '#004DF0',
    '#008897': '#004DF0',
    '#17a2b8': '#0CE3C6',
    '#e39282': '#FC814C',
    '#fff0ee': '#DCE6FF',
    '#ffeaa7': '#DCE6FF',
    '#f5f5f5': '#FAF4EE'
  };
  var FONT_OLD = /["']?Gotham["']?/gi;
  var FONT_NEW = "'IVI Glance','Noto Sans',sans-serif";

  // Nueva ilustración rebrandeada (subida a local_uploadfiles).
  var NEW_ILLUSTRATION_URL = 'https://ivirmacampus.com/pluginfile.php/1/local_uploadfiles/additionalimages/0/pop-up-off-IVI.svg';

  // Iconos en SVG en línea (azul de marca), por codepoint del emoji original.
  var ICON_SVG = {};
  ICON_SVG[0x1F512] = // 🔒 candado
    '<svg class="neo-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  ICON_SVG[0x1F527] = // 🔧 llave/ajustes
    '<svg class="neo-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.4 2.4a2 2 0 1 1-2.9-2.9l2.4-2.4z"/></svg>';
  ICON_SVG[0x1F504] = // 🔄 recargar
    '<svg class="neo-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>';

  function recolor(s) {
    if (!s) return s;
    var out = s;
    Object.keys(COLOR_MAP).forEach(function (c) {
      out = out.replace(new RegExp(c.replace('#', '\\#'), 'gi'), COLOR_MAP[c]);
    });
    return out.replace(FONT_OLD, FONT_NEW);
  }

  function injectFonts(d) {
    if (d.getElementById('neo-scorm-fonts')) return;
    var link = d.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap';
    d.head.appendChild(link);
    var st = d.createElement('style');
    st.id = 'neo-scorm-fonts';
    st.textContent =
      "@font-face{font-family:'IVI Glance';" +
      "src:url('https://ivirma.actuatxp.com/theme/actua/webfont.php?nomfont=IVIGlance-Regular.woff2') format('woff2')," +
      "url('https://ivirma.actuatxp.com/theme/actua/webfont.php?nomfont=IVIGlance-Regular.woff') format('woff');" +
      "font-weight:normal;font-style:normal;font-display:swap;}" +
      "html,body,body *{font-family:'IVI Glance','Noto Sans',sans-serif;}" +
      // el SVG del icono NO depende de fuente: color de marca y tamaño alineado al texto
      ".neo-ic{width:1.15em;height:1.15em;vertical-align:-0.22em;stroke:#004DF0;color:#004DF0;flex:0 0 auto;}";
    d.head.appendChild(st);
  }

  function replaceIcons(d) {
    d.querySelectorAll('span,i,em,b').forEach(function (el) {
      if (el.dataset.neoIcon) return;
      var txt = el.textContent || '';
      if (txt.length > 4) return; // solo elementos "icono", no párrafos
      for (var cp in ICON_SVG) {
        var ch = String.fromCodePoint(Number(cp));
        if (txt.indexOf(ch) >= 0) {
          el.textContent = txt.split(ch).join(''); // quita el emoji (queda invisible)
          el.insertAdjacentHTML('afterbegin', ICON_SVG[cp]);
          el.dataset.neoIcon = '1';
          return;
        }
      }
    });
  }

  function swapIllustration(d) {
    if (!NEW_ILLUSTRATION_URL) return;
    d.querySelectorAll('img').forEach(function (img) {
      if (img.dataset.neoImg) return;
      // sustituye la ilustración antigua (pop-up-off.svg), no la nueva ya puesta
      if (/pop-up-off(?!-ivi)/i.test(img.src)) {
        img.src = NEW_ILLUSTRATION_URL;
        img.dataset.neoImg = '1';
      }
    });
  }

  // El título "Tu contenido no se ha podido cargar…" al navy de marca.
  // Se identifica por FIRMA DE ESTILO (font-size:18px + azul/teal primario),
  // no por texto → funciona en todos los idiomas de la plataforma. Deja intactos
  // el botón y los enlaces "OPCIÓN", que comparten el azul pero no ese tamaño.
  function navyHeading(d) {
    d.querySelectorAll('[style*="18px"]').forEach(function (el) {
      if (el.dataset.neoNavy) return;
      if (el.tagName.toLowerCase() === 'svg') return;
      var st = el.getAttribute('style') || '';
      if (/font-size:\s*18px/i.test(st) && /#004DF0|#006975|#008897/i.test(st)) {
        el.setAttribute('style', st.replace(/#004DF0|#006975|#008897/ig, '#08004F'));
        el.dataset.neoNavy = '1';
      }
    });
  }

  function isPopupDoc(d) {
    try {
      if (d.querySelector('img[src*="pop-up-off"]')) return true;
      return /#006975|#008897/i.test((d.body && d.body.innerHTML) || '');
    } catch (e) { return false; }
  }

  function patch(d) {
    if (!d || !d.body || !isPopupDoc(d)) return;
    injectFonts(d);
    d.querySelectorAll('[style]').forEach(function (el) {
      if (el.dataset.neoDone) return;
      var before = el.getAttribute('style');
      var after = recolor(before);
      if (after !== before) el.setAttribute('style', after);
      el.dataset.neoDone = '1';
    });
    navyHeading(d);
    replaceIcons(d);
    swapIllustration(d);
  }

  function hookIframe(ifr) {
    if (!ifr || ifr.dataset.neoHook) return;
    ifr.dataset.neoHook = '1';
    ifr.addEventListener('load', function () { try { patch(ifr.contentDocument); } catch (e) {} });
    var t = 0, iv = setInterval(function () {
      var d = null;
      try { d = ifr.contentDocument; } catch (e) { d = null; }
      if (d) patch(d);
      if (++t > 40) clearInterval(iv);
    }, 200);
  }

  function boot() {
    if (!document.body || document.body.id !== 'page-mod-scorm-player') return;
    var t = 0, iv = setInterval(function () {
      var ifr = document.getElementById('scorm_object');
      if (ifr) hookIframe(ifr);
      patch(document); // por si algún SCORM pinta el aviso en el documento principal
      if (++t > 50) clearInterval(iv);
    }, 200);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
