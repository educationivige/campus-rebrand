<!-- MIS ÚLTIMAS INSIGNIAS — activa el layout definido en
     css-totara-organizado.css y aplica el sistema IVI (botón azul tipo píldora)
     al enlace nativo "Ver todos" / "Mostrar todos". Pegar en un bloque HTML/JS
     de la Home de externos. Instancia actual: #inst355. -->
<script>
(function () {
    'use strict';

    const CONFIG = {
        blockIds: ['inst355'],
        debug: true
    };

    function log(message) {
        if (CONFIG.debug) console.log('[Mis últimas insignias] ' + message);
    }

    function normaliseText(value) {
        return String(value || '').trim().toLocaleLowerCase();
    }

    function findSeeAll(block) {
        // 1) Enlace explícito por clase o pie del bloque.
        const direct = block.querySelector(
            'a.seeall, .footer a, .card-footer a, .block-footer a'
        );
        if (direct) return direct;

        // 2) Por etiqueta de texto en los 6 idiomas del campus. Totara usa
        //    "Mostrar todos" (no "Ver todos") en el bloque de insignias.
        const labels = [
            'ver todos', 'ver todo', 'mostrar todos', 'mostrar todo',
            'see all', 'show all', 'show all badges',
            'visualizza tutti', 'mostra tutti',
            'ver tudo', 'mostrar tudo',
            'zobrazit vše', 'zobrazit vse',
            'visa alla'
        ];
        const byLabel = Array.from(block.querySelectorAll('a')).find(function (link) {
            return labels.includes(normaliseText(link.textContent));
        });
        if (byLabel) return byLabel;

        // 3) Fallback agnóstico de idioma: un enlace que NO sea de una insignia
        //    (fuera de ul.badges) y apunte a la página de insignias.
        return Array.from(block.querySelectorAll('a')).find(function (link) {
            if (link.closest('ul.badges')) return false;
            return /badge/i.test(link.getAttribute('href') || '');
        }) || null;
    }

    function enhanceBlock(block) {
        block.classList.add('ivi-badges-enhanced');

        const list = block.querySelector('ul.badges');
        if (!list) return false;

        const seeAll = findSeeAll(block);
        if (seeAll) {
            seeAll.classList.add(
                'ivi-badges-seeall',
                'ivi-btn',
                'ivi-btn--primary',
                'ivi-btn--pill'
            );

            const wrapper = seeAll.closest('.footer') || seeAll.parentElement;
            if (wrapper) wrapper.classList.add('ivi-badges-seeall-wrap');
        }

        log(list.children.length + ' badge(s) procesados');
        return true;
    }

    function scan() {
        let enhanced = false;

        CONFIG.blockIds.forEach(function (id) {
            const block = document.getElementById(id);
            if (block && enhanceBlock(block)) enhanced = true;
        });

        return enhanced;
    }

    function boot() {
        scan();

        /* El bloque puede terminar de renderizar después del DOMContentLoaded. */
        const observer = new MutationObserver(scan);
        observer.observe(document.body, { childList: true, subtree: true });
        setTimeout(function () {
            scan();
            observer.disconnect();
        }, 8000);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }
})();
</script>
