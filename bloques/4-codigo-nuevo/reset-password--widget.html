<!-- ============================================================
     Widget (admin): abrir la ficha de un usuario para enviarle acceso
     Para alumnos EXTERNOS a los que no les llega / no encuentran el correo
     de confirmación de cuenta. Introduces su email o usuario y el widget
     localiza la ficha y te la abre para que marques en Totara:
         ☑ "Generar contraseña y notificar al usuario"
     y pulses Guardar → Totara le envía un email para acceder/establecer
     su contraseña. Vía 100% nativa, funciona estando logueada, sin Actua.

     (NOTA: el forgot_password.php nativo NO vale para esto porque Totara
     redirige a los usuarios logueados; por eso se usa este atajo.)

     Pegar en un bloque/página visible SOLO para admins. Autocontenido.
     Efecto lateral: deja el filtro de "Gestión de usuarios" aplicado a ese
     email/usuario (inocuo; se limpia desde esa página si molesta).
     ============================================================ -->

<div class="pwreset-widget">
  <p class="pwreset-desc">
    Introduce el <b>email</b> o el <b>nombre de usuario</b> del alumno externo. Se abrirá su ficha para que marques
    <b>“Generar contraseña y notificar al usuario”</b> y pulses <b>Guardar</b> → Totara le envía el email para acceder.
  </p>

  <div class="pwreset-row">
    <input type="text" id="pwreset-input" class="pwreset-input"
           placeholder="email o nombre de usuario" autocomplete="off" spellcheck="false">
    <button type="button" id="pwreset-btn" class="pwreset-btn">Abrir ficha del usuario</button>
  </div>

  <div id="pwreset-msg" class="pwreset-msg" role="status" aria-live="polite"></div>
</div>

<style>
  .pwreset-widget { max-width: 680px; margin: 0; font-family: inherit; color: #08004F; }
  .pwreset-desc   { margin: 0 0 1.3em; font-size: .95rem; line-height: 1.45; color: #333; }
  .pwreset-row    { display: flex; flex-direction: column; align-items: stretch; gap: 1.6em; }
  .pwreset-widget .pwreset-input {
    display: block !important; width: 100% !important; max-width: 100% !important; min-width: 0 !important;
    box-sizing: border-box !important; padding: .95em 1em !important;
    border: 1px solid #c7c7c7 !important; border-radius: 8px !important;
    font-size: 1.05rem !important; color: #08004F !important;
  }
  .pwreset-widget .pwreset-input:focus { outline: none !important; border-color: #004DF0 !important; box-shadow: 0 0 0 3px rgba(0,77,240,.15) !important; }
  .pwreset-btn    {
    align-self: flex-start; padding: .65em 1.5em; border: 0; border-radius: 999px;
    background: #004DF0; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: background .15s ease, opacity .15s ease;
  }
  .pwreset-btn:hover:not(:disabled) { background: #003bc4; }
  .pwreset-btn:disabled { opacity: .6; cursor: default; }
  .pwreset-msg    { margin-top: .9em; font-size: .95rem; line-height: 1.45; min-height: 1.2em; }
  .pwreset-msg a  { color: #004DF0; }
  .pwreset-msg--ok    { color: #0a7c33; }
  .pwreset-msg--warn  { color: #8a6d00; }
  .pwreset-msg--error { color: #b00020; }
</style>

<script>
(function () {
  'use strict';

  var USERS_URL = '/admin/user.php';
  var input = document.getElementById('pwreset-input');
  var btn   = document.getElementById('pwreset-btn');
  var msg   = document.getElementById('pwreset-msg');
  if (!input || !btn || !msg) return;

  function setMsg(html, type) {
    msg.innerHTML = html;
    msg.className = 'pwreset-msg' + (type ? ' pwreset-msg--' + type : '');
  }

  async function buscar() {
    var value = (input.value || '').trim();
    if (!value) { setMsg('Introduce un email o un nombre de usuario.', 'error'); input.focus(); return; }

    var isEmail = value.indexOf('@') > -1;
    var field   = isEmail ? 'user-emailunobscured' : 'user-username';

    btn.disabled = true;
    var prev = btn.textContent; btn.textContent = 'Buscando…';
    setMsg('', '');

    try {
      // 1) Leer el formulario de filtro de "Gestión de usuarios" (sesskey + campos ocultos)
      var doc  = new DOMParser().parseFromString(await (await fetch(USERS_URL, { credentials:'same-origin' })).text(), 'text/html');
      var fEl  = doc.querySelector('[name="' + field + '"]');
      var form = fEl ? fEl.closest('form') : null;
      if (!form) { setMsg('No se pudo abrir la gestión de usuarios (¿permisos o sesión?).', 'error'); return; }

      // 2) Aplicar el filtro por email/usuario ("contiene")
      var fd = new FormData();
      form.querySelectorAll('input[type=hidden], select').forEach(function(el){ if (el.name) fd.set(el.name, el.value); });
      fd.set(field, value);
      fd.set(field + '_op', '0');
      var submit = form.querySelector('[type=submit][name]');
      if (submit) fd.set(submit.name, submit.value || '1');
      await fetch(USERS_URL, { method:'POST', body: fd, credentials:'same-origin' });

      // 3) Leer la lista filtrada y localizar la fila que contiene ese valor
      var listDoc = new DOMParser().parseFromString(await (await fetch(USERS_URL, { credentials:'same-origin' })).text(), 'text/html');
      var ids = [];
      Array.from(listDoc.querySelectorAll('tr')).forEach(function(tr){
        if (tr.textContent.toLowerCase().indexOf(value.toLowerCase()) === -1) return;
        var a = tr.querySelector('a[href*="/user/"]');
        if (!a) return;
        var m = (a.getAttribute('href') || '').match(/[?&]id=(\d+)/);
        if (m && ids.indexOf(m[1]) === -1) ids.push(m[1]);
      });

      if (ids.length === 0) {
        setMsg('No se encontró ningún usuario con “' + value + '”. Revisa el email o el nombre de usuario.', 'warn');
      } else if (ids.length > 1) {
        setMsg('Hay varios usuarios que coinciden con “' + value + '”. <a href="' + USERS_URL + '" target="_blank" rel="noopener">Ábrelos en Gestión de usuarios</a> y elige el correcto.', 'warn');
      } else {
        var editUrl = '/user/editadvanced.php?id=' + ids[0];
        setMsg('✓ Usuario encontrado. <a href="' + editUrl + '" target="_blank" rel="noopener"><b>Abrir su ficha</b></a> → marca <b>“Generar contraseña y notificar al usuario”</b> y pulsa <b>Guardar</b>.', 'ok');
        window.open(editUrl, '_blank');   // best-effort; si el navegador lo bloquea, usa el enlace de arriba
      }
    } catch (err) {
      setMsg('Error al buscar el usuario: ' + ((err && err.message) ? err.message : err), 'error');
    } finally {
      btn.disabled = false; btn.textContent = prev;
    }
  }

  btn.addEventListener('click', buscar);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); buscar(); } });
})();
</script>
