<!-- ============================================================
     Widget (admin): contraseña temporal para alumnos externos
     Para alumnos EXTERNOS (creados por admin, sin confirmación) a los que
     no les llega / no ven el correo de acceso. Introduces su email o usuario
     y el widget:
       1) localiza al usuario,
       2) le asigna una CONTRASEÑA TEMPORAL aleatoria + "Forzar cambio",
       3) se la ENVÍA DIRECTAMENTE (mensaje de Totara → el usuario lo recibe
          por email), y además te muestra usuario + contraseña y un aviso
          (botón de email y de copiar) por si quieres reenviarlo.
     El alumno entra con esos datos y Totara le obliga a cambiarla.

     100% nativo, funciona estando logueada, SIN Actua.
     - Asignar pw: POST a /user/editadvanced.php.
     - Enviar: /lib/ajax/service.php → core_message_send_instant_messages.

     MULTIIDIOMA (es/en/it/pt/cs/sv): interfaz Y email salen en el idioma con
     el que estás tú (admin), vía M.cfg.currentlanguage. Marca fija: "IVI
     Institute Education". (La ficha del alumno no expone su idioma en esta
     plataforma, así que el email no se puede personalizar por alumno.)

     (El forgot_password.php nativo NO vale: Totara redirige a los logueados.
     "Generar contraseña y notificar" solo existe al CREAR, no al editar.)

     Pegar en un bloque/página visible SOLO para admins. REQUIERE el CSS del
     widget (sección 22 "pwreset" de css-totara-organizado.css, desplegado por jsDelivr).
     Efecto lateral: deja el filtro de "Gestión de usuarios" aplicado al valor
     buscado (inocuo; se limpia desde esa página si molesta).
     ============================================================ -->

<div class="pwreset-widget">
  <p class="pwreset-desc">
    Introduce el <b>email</b> o el <b>nombre de usuario</b> del alumno externo. Se le creará una
    <b>contraseña temporal</b> (con cambio obligatorio al entrar) y se le <b>enviará directamente</b>
    (le llega por email). También se te muestra por si quieres reenviarla.
  </p>

  <div class="pwreset-row">
    <input type="text" id="pwreset-input" class="pwreset-input"
           placeholder="email o nombre de usuario" autocomplete="off" spellcheck="false">
    <button type="button" id="pwreset-btn" class="pwreset-btn">Generar y enviar</button>
  </div>

  <div id="pwreset-msg" class="pwreset-msg" role="status" aria-live="polite"></div>
</div>

<!-- Estilos del widget: en css-totara-organizado.css (sección 22 "pwreset"),
     desplegado por jsDelivr. NO van inline aquí a propósito: un <style> dentro
     del <body> ganaba al tema de forma inconsistente. -->

  // Idioma: normaliza "es_mx"/"pt-BR"→"es"/"pt"; null si no lo tenemos traducido.
  function norm(l){ l = (l || '').toLowerCase().replace(/-/g, '_').split('_')[0]; return STR[l] ? l : null; }
  function curLang(){ return (window.M && M.cfg && M.cfg.currentlanguage) || document.documentElement.lang || ''; }
  var UILANG = norm(curLang()) || 'es';
  var T = STR[UILANG].ui;   // strings de interfaz (idioma del admin)

  var btn   = document.getElementById('pwreset-btn');
  var msg   = document.getElementById('pwreset-msg');

  // Aplica la interfaz en el idioma del admin
  var descEl = document.querySelector('.pwreset-widget .pwreset-desc');
  if (descEl) descEl.innerHTML = T.desc;
  input.placeholder = T.placeholder;
  btn.textContent   = T.btn;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function setMsg(html, type){ msg.innerHTML = html; msg.className = 'pwreset-msg' + (type ? ' pwreset-msg--' + type : ''); }
  function sesskey(){ return (window.M && M.cfg && M.cfg.sesskey) || ''; }

  function genPw(){
    var U='ABCDEFGHJKLMNPQRSTUVWXYZ', l='abcdefghijkmnpqrstuvwxyz', d='23456789', s='!#$%*?';
    function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
    var p = pick(U) + pick(l) + pick(d) + pick(s);
    for (var i=0;i<7;i++) p += pick(U+l+d+s);
    return p;
  }

  // 1) Localizar id del usuario por email/usuario (filtro de Gestión de usuarios)
  async function lookupIds(value, isEmail){
    var field = isEmail ? 'user-emailunobscured' : 'user-username';
    var doc  = new DOMParser().parseFromString(await (await fetch(USERS_URL,{credentials:'same-origin'})).text(), 'text/html');
    var fEl  = doc.querySelector('[name="'+field+'"]');
    var form = fEl ? fEl.closest('form') : null;
    if (!form) throw new Error(T.errUsers);
    var fd = new FormData();
    form.querySelectorAll('input[type=hidden], select').forEach(function(el){ if(el.name) fd.set(el.name, el.value); });
    fd.set(field, value); fd.set(field + '_op', '0');
    var submit = form.querySelector('[type=submit][name]'); if (submit) fd.set(submit.name, submit.value || '1');
    await fetch(USERS_URL, { method:'POST', body: fd, credentials:'same-origin' });
    var listDoc = new DOMParser().parseFromString(await (await fetch(USERS_URL,{credentials:'same-origin'})).text(), 'text/html');
    var ids = [];
    Array.from(listDoc.querySelectorAll('tr')).forEach(function(tr){
      if (tr.textContent.toLowerCase().indexOf(value.toLowerCase()) === -1) return;
      var a = tr.querySelector('a[href*="/user/"]'); if (!a) return;
      var m = (a.getAttribute('href')||'').match(/[?&]id=(\d+)/); if (m && ids.indexOf(m[1]) === -1) ids.push(m[1]);
    });
    return ids;
  }

  // 2) Asignar contraseña temporal + forzar cambio
  async function setTempPassword(id){
    var editDoc = new DOMParser().parseFromString(await (await fetch(EDIT_URL+'?id='+id,{credentials:'same-origin'})).text(), 'text/html');
    var npw  = editDoc.querySelector('[name="newpassword"]');
    var form = npw ? npw.closest('form') : null;
    if (!form) throw new Error(T.errEdit);
    var get = function(n){ var e = editDoc.querySelector('[name="'+n+'"]'); return e ? (e.value||'') : ''; };
    var data = { id: id, username: get('username'), email: get('email'), firstname: get('firstname'), lastname: get('lastname') };
    var tempPw = genPw();
    var fd = new FormData(form);
    fd.set('newpassword', tempPw);
    fd.set('preference_auth_forcepasswordchange', '1');
    var submit = form.querySelector('[type=submit][name]'); if (submit) fd.set(submit.name, submit.value || '1');
    var res = await fetch(form.getAttribute('action') || EDIT_URL, { method:'POST', body: fd, credentials:'same-origin' });
    if (/editadvanced/.test(res.url)) {
      var t = await res.text();
      throw new Error(/password|contrase|lösenord|heslo|palavra-passe|senha/i.test(t) ? T.errPolicy : T.errSave);
    }
    data.tempPw = tempPw;
    return data;
  }

  // 3) Enviar mensaje de Totara (lo reenvía por email al usuario)
  async function enviarMensaje(userid, texto){
    var sk = sesskey();
    if (!sk) return { ok:false, err:'sin sesskey' };
    var payload = [{ index:0, methodname:'core_message_send_instant_messages',
      args:{ messages:[{ touserid: Number(userid), text: texto, textformat: 1, clientmsgid: 'pwset-'+Date.now() }] } }];
    try {
      var res  = await fetch(AJAX_URL + '?sesskey=' + encodeURIComponent(sk) + '&info=core_message_send_instant_messages',
        { method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      var json = await res.json();
      if (Array.isArray(json) && json[0] && json[0].error === false) return { ok:true };
      return { ok:false, err: (json[0] && json[0].exception && json[0].exception.message) || 'respuesta inesperada' };
    } catch (e) { return { ok:false, err: (e && e.message) || 'error de red' }; }
  }

  function nombreCompleto(r){ return [r.firstname, r.lastname].filter(Boolean).join(' '); }

  // Texto plano del aviso (para el mailto y el botón de copiar), en idioma del alumno (M)
  function avisoTexto(r, M){
    var n = nombreCompleto(r);
    return M.hello + (n ? ' ' + n : '') + ',\n\n'
      + M.intro.replace('{b}', BRAND) + '\n\n'
      + M.user + ' ' + r.username + '\n'
      + M.pw + ' ' + r.tempPw + '\n\n'
      + M.go.replace('{url}', LOGIN_URL) + '\n\n'
      + M.bye + '\n'
      + M.sign;
  }

  // HTML del aviso (para el mensaje de Totara, que se reenvía por email con formato)
  function avisoHtml(r, M){
    var n = nombreCompleto(r);
    return '<p>' + M.hello + (n ? ' ' + esc(n) : '') + ',</p>'
      + '<p>' + M.intro.replace('{b}', '<strong>' + BRAND + '</strong>') + '</p>'
      + '<p><strong>' + M.user + '</strong> ' + esc(r.username) + '<br>'
      + '<strong>' + M.pw + '</strong> ' + esc(r.tempPw) + '</p>'
      + '<p>' + M.go.replace('{url}', '<a href="' + esc(LOGIN_URL) + '">' + esc(LOGIN_URL) + '</a>') + '</p>'
      + '<p>' + M.bye + '<br><strong>' + M.sign + '</strong></p>';
  }

  function mostrarResultado(r, envio, M){
    var aviso  = avisoTexto(r, M);
    var mailto = 'mailto:' + encodeURIComponent(r.email)
      + '?subject=' + encodeURIComponent(M.subject)
      + '&body=' + encodeURIComponent(aviso);

    var ico = function(n){ return '<span class="material-symbols-outlined" aria-hidden="true">' + n + '</span>'; };
    var cabecera = envio.ok
      ? ico('check_circle') + ' ' + T.okHead.replace('{email}', esc(r.email))
      : ico('check_circle') + ' ' + T.failHead.replace('{err}', esc(envio.err));

    setMsg(
      cabecera
      + '<div class="pwreset-cred"><b>' + T.labelUser + '</b> <code>' + esc(r.username) + '</code><br>'
      + '<b>' + T.labelPw + '</b> <code>' + esc(r.tempPw) + '</code></div>'
      + '<div class="pwreset-actions">'
      + (r.email ? '<a class="pwreset-mail" href="' + esc(mailto) + '">' + ico('mail') + ' ' + (envio.ok ? T.mailResend : T.mailSend) + '</a>' : '')
      + '<button type="button" class="pwreset-copy">' + T.copy + '</button>'
      + '</div>', envio.ok ? 'ok' : 'warn');

    var copyBtn = msg.querySelector('.pwreset-copy');
    if (copyBtn) copyBtn.addEventListener('click', function(){
      var b = this;
      (navigator.clipboard ? navigator.clipboard.writeText(aviso) : Promise.reject())
        .then(function(){ b.textContent = T.copied; }, function(){ b.textContent = T.copyManual; });
    });
  }

  async function run(){
    var value = (input.value || '').trim();
    if (!value) { setMsg(T.needInput, 'error'); input.focus(); return; }
    var isEmail = value.indexOf('@') > -1;

    btn.disabled = true; var prev = btn.textContent; btn.textContent = T.processing; setMsg('', '');
    try {
      var ids = await lookupIds(value, isEmail);
      if (ids.length === 0) { setMsg(T.notFound.replace('{v}', esc(value)), 'warn'); return; }
      if (ids.length > 1)  { setMsg(T.multiple.replace('{v}', esc(value)), 'warn'); return; }
      var r = await setTempPassword(ids[0]);
      var ML = STR[UILANG].mail;   // email en el idioma del admin (la plataforma no expone el del alumno)
      var envio = await enviarMensaje(r.id, avisoHtml(r, ML));
      mostrarResultado(r, envio, ML);
    } catch (err) {
      setMsg(T.errPrefix + ((err && err.message) ? err.message : err), 'error');
    } finally {
      btn.disabled = false; btn.textContent = prev;
    }
  }

  btn.addEventListener('click', run);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); run(); } });
})();
</script>
