<!-- ============================================================
     Widget: Enviar restablecimiento de contraseña (admin)
     Para alumnos EXTERNOS recién creados a los que no les llega / no
     encuentran el correo de confirmación de cuenta. Dispara el flujo
     nativo de Totara "Contraseña olvidada" (login/forgot_password.php):
     el usuario recibe un email con el enlace para ESTABLECER su contraseña.

     Pegar en un bloque/página visible SOLO para admins (p.ej. un dashboard
     de administración). Autocontenido: no depende del CSS del tema.

     REQUISITO: la cuenta debe estar CONFIRMADA (las creadas por admin suelen
     estarlo). Si no, Totara no envía el reset; confírmala antes.
     ============================================================ -->

<div class="pwreset-widget">
  <p class="pwreset-desc">
    Introduce el <b>email</b> o el <b>nombre de usuario</b> del alumno externo y pulsa enviar.
    Recibirá un correo con el enlace para establecer su contraseña (flujo de “Contraseña olvidada”).
  </p>

  <div class="pwreset-row">
    <input type="text" id="pwreset-input" class="pwreset-input"
           placeholder="email o nombre de usuario" autocomplete="off" spellcheck="false">
    <button type="button" id="pwreset-btn" class="pwreset-btn">Enviar restablecimiento</button>
  </div>

  <div id="pwreset-msg" class="pwreset-msg" role="status" aria-live="polite"></div>
</div>

<style>
  .pwreset-widget { max-width: 680px; margin: 0; font-family: inherit; color: #08004F; }
  .pwreset-desc   { margin: 0 0 1.3em; font-size: .95rem; line-height: 1.45; color: #333; }
  /* Apilado (campo arriba, botón debajo) con hueco claro: funciona bien también
     en bloques estrechos, donde el layout en fila quedaba apretado/truncado. */
  .pwreset-row    { display: flex; flex-direction: column; align-items: stretch; gap: 1.6em; }
  .pwreset-input  {
    width: 100% !important; max-width: 100% !important; box-sizing: border-box !important;
    padding: .95em 1em !important; border: 1px solid #c7c7c7 !important; border-radius: 8px !important;
    font-size: 1.05rem !important; color: #08004F !important;
  }
  .pwreset-input:focus { outline: none; border-color: #004DF0; box-shadow: 0 0 0 3px rgba(0,77,240,.15); }
  .pwreset-btn    {
    align-self: flex-start; padding: .65em 1.5em; border: 0; border-radius: 999px;
    background: #004DF0; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: background .15s ease, opacity .15s ease;
  }
  .pwreset-btn:hover:not(:disabled) { background: #003bc4; }
  .pwreset-btn:disabled { opacity: .6; cursor: default; }
  .pwreset-msg    { margin-top: .8em; font-size: .95rem; line-height: 1.4; min-height: 1.2em; }
  .pwreset-msg--ok    { color: #0a7c33; }
  .pwreset-msg--warn  { color: #8a6d00; }
  .pwreset-msg--error { color: #b00020; }
</style>

<script>
(function () {
  'use strict';

  var FORGOT_URL = '/login/forgot_password.php';
  var input = document.getElementById('pwreset-input');
  var btn   = document.getElementById('pwreset-btn');
  var msg   = document.getElementById('pwreset-msg');
  if (!input || !btn || !msg) return;

  function setMsg(text, type) {
    msg.textContent = text;
    msg.className = 'pwreset-msg' + (type ? ' pwreset-msg--' + type : '');
  }

  async function enviar() {
    var value = (input.value || '').trim();
    if (!value) { setMsg('Introduce un email o un nombre de usuario.', 'error'); input.focus(); return; }

    var isEmail = value.indexOf('@') > -1;
    var field   = isEmail ? 'email' : 'username';

    btn.disabled = true;
    var prevLabel = btn.textContent;
    btn.textContent = 'Enviando…';
    setMsg('', '');

    try {
      // 1) Abrir el formulario nativo para leer sesskey + campos ocultos (_qf__, etc.)
      var getRes  = await fetch(FORGOT_URL, { credentials: 'same-origin' });
      var doc     = new DOMParser().parseFromString(await getRes.text(), 'text/html');

      // 2) Localizar el formulario que contiene el campo objetivo (email o username)
      var form = null, forms = doc.querySelectorAll('form');
      for (var i = 0; i < forms.length; i++) {
        if (forms[i].querySelector('[name="' + field + '"]')) { form = forms[i]; break; }
      }

      var fd = new FormData();
      var action = FORGOT_URL;

      if (form) {
        // Copiar los inputs del formulario (sesskey, marcador _qf__, etc.)
        var els = form.querySelectorAll('input, select, textarea');
        for (var j = 0; j < els.length; j++) {
          var el = els[j];
          if (!el.name || el.type === 'submit' || el.type === 'button') continue;
          fd.set(el.name, el.value);
        }
        var submit = form.querySelector('[type="submit"][name]');
        if (submit) fd.set(submit.name, submit.value || '1');
        action = form.getAttribute('action') || FORGOT_URL;
      } else {
        // Fallback (p.ej. si estando logueado no se renderiza el formulario):
        // POST directo con el sesskey de la sesión y el marcador estándar.
        var sk = (window.M && M.cfg && M.cfg.sesskey) || '';
        if (!sk) { setMsg('No se pudo leer el formulario de restablecimiento (sesión). Recarga e inténtalo de nuevo.', 'error'); return; }
        fd.set('sesskey', sk);
        fd.set('_qf__login_forgot_password_form', '1');
      }

      fd.set(field, value);
      fd.set(isEmail ? 'username' : 'email', '');   // el otro campo, vacío

      // 3) Enviar la solicitud
      var postRes  = await fetch(action, { method: 'POST', body: fd, credentials: 'same-origin' });
      var postHtml = await postRes.text();

      // 4) Resultado. Por privacidad, Totara confirma el envío sin revelar si la cuenta existe.
      var ok = /(se le deber[ií]a haber enviado|should have been sent|deveria ter sido enviado|dovrebbe esser|m[ěe]l b[ýy]t odesl[áa]n|skickats)/i.test(postHtml);
      if (ok) {
        setMsg('✓ Solicitud enviada. Si la cuenta existe y está confirmada, el alumno recibirá un email con el enlace para establecer su contraseña.', 'ok');
        input.value = '';
      } else {
        setMsg('Solicitud procesada, pero no se confirmó el envío. Verifica que la cuenta esté confirmada y que el email/usuario es correcto, y vuelve a intentarlo.', 'warn');
      }
    } catch (err) {
      setMsg('Error de red al enviar la solicitud: ' + ((err && err.message) ? err.message : err), 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = prevLabel;
    }
  }

  btn.addEventListener('click', enviar);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); enviar(); } });
})();
</script>
