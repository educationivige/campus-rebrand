<!-- CSS y JS dinámicos desde jsDelivr -->
<link id="totara-css" rel="stylesheet" href="">

<!-- Fallback para navegadores sin JS -->
<noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/carlesv90/totara@main/css.css">
</noscript>

<script>
// CONFIGURACIÓN SIMPLE
let CSS_COMMIT = "651156efe70a52a4c3226a0277dbb7061b7575f1"; // Cambiar commit CSS aquí
let JS_COMMIT = "main";  // Cambiar commit JS aquí

// Cargar CSS
function loadCSS() {
    document.getElementById("totara-css").href = 
        `https://cdn.jsdelivr.net/gh/carlesv90/totara@${CSS_COMMIT}/css.css`;
}

// Cargar JS
function loadJS() {
    const oldScript = document.getElementById("totara-js");
    if (oldScript) oldScript.remove();
    
    const script = document.createElement('script');
    script.id = "totara-js";
    script.src = `https://cdn.jsdelivr.net/gh/carlesv90/totara@${JS_COMMIT}/js.js`;
    document.head.appendChild(script);
}

// Inicializar
loadCSS();
//loadJS();

// Limpiar CSS crítico después de cargar
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
        const critical = document.getElementById('critical-css');
        if (critical) critical.remove();
    }, 2000);
});

// Funciones públicas para actualizar
window.updateTotaraCSS = function(commit) {
    if (commit) CSS_COMMIT = commit;
    loadCSS();
};

window.updateTotaraJS = function(commit) {
    if (commit) JS_COMMIT = commit;
    loadJS();
};

window.updateTotara = function(cssCommit, jsCommit) {
    if (cssCommit) CSS_COMMIT = cssCommit;
    if (jsCommit) JS_COMMIT = jsCommit;
    loadCSS();
    loadJS();
};

window.checkTotara = function() {
    const css = document.getElementById('totara-css');
    const js = document.getElementById('totara-js');
    console.log('CSS:', css ? '✅ Cargado' : '❌ Falta');
    console.log('JS:', js ? '✅ Cargado' : '❌ Falta');
    if (!js) loadJS(); // Recargar JS si falta
};

console.log('Totara resources loaded from:', `carlesv90/totara@${CSS_COMMIT}`);
</script>
